<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ARCHIVE : FILE-001</title>
    <link rel="stylesheet" href="/styles/ui.css" />
  </head>
  <body>
    <canvas id="scene-canvas"></canvas>

    <div id="loading-screen" class="loading-screen">
      <div class="loading-screen__mark">ARCHIVE</div>
      <div class="loading-screen__bar"><div id="loading-screen__fill" class="loading-screen__fill"></div></div>
    </div>

    <div id="start-prompt" class="start-prompt" hidden>
      <div class="start-prompt__card">
        <div class="start-prompt__title">ARCHIVE</div>
        <div class="start-prompt__body">Click to step inside.</div>
        <div class="start-prompt__hint">Move — W A S D &nbsp;·&nbsp; Look — Mouse &nbsp;·&nbsp; Interact — Click<br />Casebook — Tab</div>
      </div>
    </div>

    <div id="reticle" class="reticle" hidden></div>
    <div id="interact-glint" class="interact-glint" hidden></div>

    <div id="caption" class="caption" hidden></div>

    <div id="casebook" class="casebook" hidden>
      <div class="casebook__page">
        <div class="casebook__header">
          <span class="casebook__case-id">CASE 001</span>
          <span class="casebook__case-name">The Clerk's Desk</span>
        </div>
        <div id="casebook__contents" class="casebook__contents"></div>
        <div class="casebook__footer">Tab to close</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
