<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ARCHIVE : FILE-001</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151008'/%3E%3Cpath d='M16 5 L27 24 H5 Z' fill='none' stroke='%23c2903f' stroke-width='2'/%3E%3Ccircle cx='16' cy='18' r='2' fill='%23c2903f'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles/ui.css" />
  </head>
  <body>
    <canvas id="scene-canvas"></canvas>

    <div id="loading-screen" class="loading-screen">
      <div class="loading-screen__mark">ARCHIVE</div>
      <div class="loading-screen__bar"><div id="loading-screen__fill" class="loading-screen__fill"></div></div>
    </div>

    <div id="start-prompt" class="start-prompt" hidden>
      <div class="start-prompt__card">
        <div class="start-prompt__title" data-i18n="game.title">ARCHIVE</div>
        <div class="start-prompt__body" data-i18n="start.body">Tap to step inside.</div>
        <div id="start-prompt__hint" class="start-prompt__hint" data-i18n-html="start.hint.desktop">Move — W A S D &nbsp;·&nbsp; Look — Mouse &nbsp;·&nbsp; Interact — Click<br />Casebook — Tab</div>
      </div>
    </div>

    <div id="reticle" class="reticle" hidden></div>
    <div id="interact-glint" class="interact-glint" hidden></div>

    <div id="caption" class="caption" hidden></div>

    <button id="settings-btn" class="corner-btn corner-btn--settings" aria-label="Settings">
      <span class="corner-btn__gear"></span>
    </button>

    <div id="touch-controls" class="touch-controls" hidden>
      <div id="touch-look-layer" class="touch-look-layer"></div>
      <div id="touch-joystick" class="touch-joystick" aria-hidden="true">
        <div id="touch-joystick-knob" class="touch-joystick__knob"></div>
      </div>
      <button id="touch-interact-btn" class="touch-btn touch-btn--interact" aria-label="Interact"></button>
      <button id="touch-casebook-btn" class="touch-btn touch-btn--casebook" aria-label="Casebook">
        <span class="touch-btn__book"></span>
      </button>
    </div>

    <div id="casebook" class="casebook" hidden>
      <div class="casebook__page">
        <div class="casebook__header">
          <span class="casebook__case-id" data-i18n="casebook.title">CASEBOOK</span>
        </div>
        <div id="casebook__contents" class="casebook__contents"></div>
        <div class="casebook__footer" data-i18n="casebook.footer">Tab, or tap outside, to close</div>
      </div>
    </div>

    <div id="settings-panel" class="settings-panel" hidden>
      <div class="settings-panel__page">
        <div class="settings-panel__header">
          <span data-i18n="settings.title">SETTINGS</span>
        </div>

        <div class="settings-panel__row">
          <span class="settings-panel__label" data-i18n="settings.language">Language</span>
          <div class="settings-panel__lang-toggle">
            <button id="settings-lang-en" class="settings-panel__lang-btn" data-lang="en" data-i18n="settings.language.en">English</button>
            <button id="settings-lang-ar" class="settings-panel__lang-btn" data-lang="ar" data-i18n="settings.language.ar">Arabic</button>
          </div>
        </div>

        <div class="settings-panel__row">
          <span class="settings-panel__label" data-i18n="settings.brightness">Brightness</span>
          <input id="settings-brightness" class="settings-panel__slider" type="range" min="0.8" max="2.4" step="0.05" />
        </div>

        <button id="settings-close-btn" class="settings-panel__close" data-i18n="settings.close">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
